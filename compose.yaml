name: unifica-demo
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    env_file: .demo/keycloak.env
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:5000:8000"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./.demo/import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /realms/unifica-demo/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8081\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 24
  portal:
    image: unifica-portal:demo
    build: .
    env_file: .demo/app.env
    # Compartilha apenas a rede do Keycloak, nao a rede do computador.
    # Assim localhost:8081 funciona no navegador e no cliente OIDC do Flask.
    network_mode: "service:keycloak"
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  keycloak_data:
