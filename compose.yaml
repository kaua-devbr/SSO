name: unifica-demo
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    env_file: .demo/keycloak.env
    environment:
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./.demo/import:/opt/keycloak/data/import:ro
volumes:
  keycloak_data:
